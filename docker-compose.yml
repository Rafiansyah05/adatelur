services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: adatelur-web
    restart: always
    ports:
      - "3020:3000"
    env_file:
      - .env
    # If you use a reverse proxy like Nginx or Cloudflare Tunnels, 
    # it will route to this port (3020).
